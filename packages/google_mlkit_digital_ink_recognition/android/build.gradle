group = "com.google_mlkit_digital_ink_recognition"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

android {
    namespace = "com.google_mlkit_digital_ink_recognition"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
        consumerProguardFiles("consumer-rules.pro")
    }

    dependencies {
        implementation("com.google.mlkit:digital-ink-recognition:19.0.0")
        // digital-ink-recognition 19.0.0 brings work-runtime 2.7.0, which crashes
        // on launch under R8 full mode (default since AGP 9).
        implementation("androidx.work:work-runtime:2.10.5")
    }
}

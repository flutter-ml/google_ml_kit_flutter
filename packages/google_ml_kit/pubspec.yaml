name: google_ml_kit
description: "A Flutter plugin to use all APIs from Google's standalone ML Kit for mobile platforms."
version: 1.0.0
homepage: https://github.com/flutter-ml/google_ml_kit_flutter
repository: https://github.com/flutter-ml/google_ml_kit_flutter/tree/master/packages/google_ml_kit

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Vision APIs
  google_mlkit_commons: ^1.0.0
  google_mlkit_barcode_scanning: ^1.0.0
  google_mlkit_digital_ink_recognition: ^1.0.0
  google_mlkit_face_detection: ^1.0.0
  google_mlkit_face_mesh_detection: ^0.7.0
  google_mlkit_image_labeling: ^1.0.0
  google_mlkit_object_detection: ^1.0.0
  google_mlkit_pose_detection: ^1.0.0
  google_mlkit_selfie_segmentation: ^1.0.0
  google_mlkit_text_recognition: ^1.0.0

  # Natural Language APIs
  google_mlkit_entity_extraction: ^1.0.0
  google_mlkit_language_id: ^1.0.0
  google_mlkit_translation: ^1.0.0
  google_mlkit_smart_reply: ^1.0.0

  # GenAI APIs
  google_mlkit_genai_summarization: ^0.4.0
  google_mlkit_genai_proofreading: ^0.4.0
  google_mlkit_genai_rewriting: ^0.4.0
  google_mlkit_genai_image_description: ^0.4.0
  google_mlkit_genai_speech_recognition: ^0.4.0
  google_mlkit_genai_prompt: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

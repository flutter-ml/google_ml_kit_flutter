name: Android setup
description: >
  Installs the Android NDK and fetches dependencies for packages/example.
runs:
  using: composite
  steps:
    # Pre-install the NDK so Gradle doesn't download it mid-build;
    # a failed CDN download then breaks this small step instead of the
    # whole build. sdkmanager is not on the PATH, hence the full path.
    # Keep the version in sync with flutter.ndkVersion.
    #
    # set +o pipefail is required because composite actions enforce
    # `set -o pipefail` with `shell: bash`. When sdkmanager finishes,
    # it closes stdin, causing `yes` to receive SIGPIPE (exit code 141),
    # which fails the entire step under pipefail.
    - name: Install Android NDK
      shell: bash
      run: |
        set +o pipefail
        sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

    - name: Install dependencies
      shell: bash
      working-directory: packages/example
      run: flutter pub get

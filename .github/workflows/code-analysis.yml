name: Static code analysis

on:
  push:
    branches:
      - master
      - develop
      - test
      - chore
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint-dart:
    name: Lint Dart code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Extract Flutter version from pubspec.yaml
        id: flutter-version
        run: |
          FLUTTER_VER=$(awk '/environment:/{flag=1; next} flag && /flutter:/{print $2; flag=0}' packages/example/pubspec.yaml | tr -d "'\"=><")
          echo "version=$FLUTTER_VER" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}

      - name: Install dependencies for all packages
        run: |
          for d in packages/*/; do
            (cd "$d" && flutter pub get) || exit 1
          done

      # Check for any formatting issues in the code.
      - run: dart format --set-exit-if-changed .

      # Statically analyze the Dart code for any errors.
      - run: flutter analyze .

  lint-kotlin:
    name: Lint Kotlin code (ktlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Install and run ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod a+x ktlint
          ./ktlint

  lint-swift:
    name: Lint Swift code (SwiftLint)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint on Swift code
        run: swiftlint lint
